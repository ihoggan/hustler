name: Validate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check syntax (py_compile)
      run: |
        python -m py_compile hustler.py
        python -m py_compile cushion_path.py

    - name: Run selftest suite
      run: |
        python3 hustler.py --selftest

    - name: Run batch validation (N=30 strikes)
      run: |
        python3 hustler.py --batch 30

    - name: Run smoke test (headless, 90 frames)
      run: |
        python3 hustler.py --smoke

    - name: Snapshot render (headless)
      continue-on-error: true
      run: |
        python3 hustler.py --snap /tmp/baseline.png

    - name: Check cushion_path.py standalone
      run: |
        python3 cushion_path.py

    - name: Upload validation artifacts (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: validation-logs-py${{ matrix.python-version }}
        path: |
          /tmp/baseline.png
          *.log
        retention-days: 7
        if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        pip install pylint black isort

    - name: Check code format (black)
      run: |
        black --check hustler.py cushion_path.py
      continue-on-error: true

    - name: Check import sort (isort)
      run: |
        isort --check-only hustler.py cushion_path.py
      continue-on-error: true
