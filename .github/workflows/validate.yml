name: Validate

# The --snap baseline. Byte-identical since R6.1 and verified on every push:
# it is the only automated guard on the rendered scene. If you are DELIBERATELY
# re-capturing the baseline, change this hash in the same commit and say so in
# the commit message -- that is the whole point of it living here.
env:
  SNAP_MD5: 62c87ddb6d1f0ee36f36a71a5000cd5f
  # r31: the assertion COUNT, not just "did it pass". A stale or truncated
  # hustler.py whose remaining assertions all pass exits 0 and turns this
  # workflow green -- which is exactly how an R7-era file once survived every
  # check. Bump this deliberately when you add an assertion; the upkeep IS
  # the guard.
  SELFTEST_COUNT: 80
  # Likewise: cushion_path.py printing *something* is not the same as it
  # printing the whole table.
  CUSHION_PRIMITIVES: 36

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check syntax (py_compile)
      run: |
        python -m py_compile hustler.py
        python -m py_compile cushion_path.py
        # r31.1: these two are tracked but nothing had ever checked them, so
        # they could rot silently against a changing hustler.py.
        python -m py_compile distance_calibration_sweep.py
        python -m py_compile floor_threshold_audit.py

    - name: Run selftest suite
      run: |
        python3 hustler.py --selftest | tee /tmp/selftest.log
        pass_n=$(grep -c '\[PASS\]' /tmp/selftest.log)
        fail_n=$(grep -c '\[FAIL\]' /tmp/selftest.log || true)
        echo "assertions: $pass_n passed, $fail_n failed (expected $SELFTEST_COUNT / 0)"
        test "$pass_n" -eq "$SELFTEST_COUNT"
        test "$fail_n" -eq 0

    - name: Run batch validation (N=30 strikes)
      run: |
        python3 hustler.py --batch 30

    - name: Run smoke test (headless, 90 frames)
      run: |
        python3 hustler.py --smoke

    - name: Snapshot render + byte-identical check (headless)
      run: |
        python3 hustler.py --snap /tmp/baseline.png
        echo "expected: $SNAP_MD5"
        echo "actual  : $(md5sum /tmp/baseline.png | cut -d' ' -f1)"
        echo "$SNAP_MD5  /tmp/baseline.png" | md5sum -c -

    - name: Check cushion_path.py standalone
      run: |
        python3 cushion_path.py | tee /tmp/cushion.log
        prim_n=$(grep -cE '^[[:space:]]*[0-9]+[[:space:]]+(arc|line)' /tmp/cushion.log)
        echo "primitives: $prim_n (expected $CUSHION_PRIMITIVES)"
        test "$prim_n" -eq "$CUSHION_PRIMITIVES"

    - name: Upload validation artifacts (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: validation-logs-py${{ matrix.python-version }}
        path: |
          /tmp/baseline.png
          *.log
        retention-days: 7
        if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # r31.1: NOTHING in this workflow is advisory any more. Every step here
    # can fail the build, which is the only thing that makes a check worth
    # having -- isort had been genuinely failing for months behind
    # continue-on-error and nobody saw it, precisely because the job was
    # known to be ignorable.
    #
    # black was REMOVED rather than fixed, deliberately. Its diff on this
    # repo is 1353 removals against 2469 additions -- roughly a third of
    # hustler.py -- and 251 of those lines are aligned inline comments,
    # including the CFG table where the alignment is doing real documentation
    # work for the physics constants. Applying it would bury every future
    # real change under a reformat, which is the same phantom-diff problem
    # r30.3 removed by normalising line endings. A permanently-red check that
    # everyone learns to ignore is worse than no check at all.
    #
    # pyflakes takes its place, and it earns it: pyflakes is what found the
    # r31 `finale` bug, by reporting a local variable assigned and never
    # used -- the signature of a missing `nonlocal`. It is a semantic check,
    # not a cosmetic one, and it is clean.
    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        pip install isort pyflakes

    - name: Check import sort (isort)
      run: |
        isort --check-only hustler.py cushion_path.py \
              distance_calibration_sweep.py floor_threshold_audit.py

    - name: Check for dead code and undefined names (pyflakes)
      run: |
        python -m pyflakes hustler.py cushion_path.py \
               distance_calibration_sweep.py floor_threshold_audit.py
